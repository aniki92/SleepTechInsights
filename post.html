@'
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading… | SleepTechInsights</title>
<link rel="canonical" href="https://www.sleeptechinsights.com/" />
<meta name="description" content="">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:type" content="article">
<meta property="og:url" content="">
<meta property="og:image" content="">
<link rel="stylesheet" href="/style.css">
<meta name="theme-color" content="#0e1226">

<!-- GA4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XDNXB6YJKD"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date());gtag("config","G-XDNXB6YJKD",{send_page_view:true});</script>

<style>
  .post-wrap{max-width:860px;margin:0 auto;padding:40px 20px}
  .post-hero{margin:10px 0 20px;color:#aab4e0}
  .post img{max-width:100%;border-radius:12px}
  .product-box{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;margin:16px 0}
  .product-box img{width:120px;height:auto;border-radius:10px}
  .post h1,h2,h3{scroll-margin-top:80px}
</style>
</head>
<body>
  <header class="site-header">
    <div class="container header__inner">
      <a class="brand" href="/" aria-label="SleepTechInsights home">
        <span class="brand__moon" aria-hidden="true">◐</span>
        <span class="brand__text">SleepTech<span>Insights</span></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/#reviews">Reviews</a>
        <a href="/#blog">Tips</a>
        <a href="/#newsletter">Newsletter</a>
      </nav>
    </div>
  </header>

  <main class="post-wrap">
    <article class="card post" style="padding:24px">
      <header>
        <p><a class="text-link" href="/">← Back to Home</a></p>
        <h1 id="post-title">Loading…</h1>
        <p class="post-hero" id="post-meta"></p>
      </header>
      <div id="post-content" class="post">Loading content…</div>
    </article>

    <section class="newsletter" style="margin-top:22px">
      <div class="container" style="max-width:860px;padding:0">
        <h2>Get Weekly Sleep Tech Tips</h2>
        <form class="newsletter__form js-newsletter" data-location="post-inline" action="https://formspree.io/f/mkgqoynb" method="POST">
          <input name="email" type="email" inputmode="email" placeholder="you@example.com" required>
          <button type="submit" class="btn btn--glow">Subscribe Free</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer__legal">
      <small>© <span id="y"></span> SleepTechInsights • Evidence-based, affiliate-supported.</small>
    </div>
  </footer>

<script>
  // Year
  document.getElementById('y').textContent = new Date().getFullYear();

  // --- Tiny Markdown -> HTML
  function mdToHtml(md){
    md = md.replace(/[&<>]/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]));
    md = md.replace(/```([\s\S]*?)```/g, (_,c)=>'<pre><code>'+c.replace(/</g,'&lt;')+'</code></pre>');
    md = md.replace(/^### (.*)$/gm,'<h3>$1</h3>')
           .replace(/^## (.*)$/gm,'<h2>$1</h2>')
           .replace(/^# (.*)$/gm,'<h1>$1</h1>');
    md = md.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
           .replace(/\*(.*?)\*/g,'<em>$1</em>');
    md = md.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">');
    md = md.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
    md = md.replace(/(?:^|\n)[*-] (.*)(?=\n|$)/g,(m,item)=>`\n<li>${item}</li>`);
    md = md.replace(/(?:<li>[\s\S]*<\/li>)/g,s=>'<ul>'+s+'</ul>');
    md = md.replace(/^(?!<h\d|<ul|<li|<pre|<img|<p|<\/)(.+)$/gm,'<p>$1</p>');
    return md;
  }

  // Get slug
  function getSlug(){
    const u=new URL(location.href);
    if (u.searchParams.get('slug')) return u.searchParams.get('slug');
    const m=location.pathname.match(/\/posts\/([^/]+)\/?$/);
    return m ? m[1] : null;
  }

  // --- Cloudflare CDN rewrite (responsive)
  const IMG_CDN = "https://img.sleeptechinsights.com";
  function rewriteImagesToCdn() {
    const root = document.getElementById("post-content");
    root.querySelectorAll("img").forEach(img => {
      const src = img.getAttribute("src");
      if (!src || !src.startsWith("/images/posts/")) return;

      const widths = [480, 768, 1200, 1600];
      img.srcset = widths
        .map(w => `${IMG_CDN}/cdn-cgi/image/format=auto,quality=85,width=${w}${src} ${w}w`)
        .join(", ");
      img.sizes = "(max-width: 768px) 92vw, 860px";
      img.src   = `${IMG_CDN}/cdn-cgi/image/format=auto,quality=85,width=1200${src}`;
    });
  }

  // Affiliate mapper
  async function resolveAffiliateLinks() {
    const root = document.getElementById('post-content');
    const anchors = [...root.querySelectorAll('a[href^="aff:"]')];
    if (!anchors.length) return;
    let map = {};
    try {
      const res = await fetch('/affiliates.json', { cache: 'no-store' });
      map = res.ok ? await res.json() : {};
    } catch {}
    anchors.forEach(a => {
      const slug = a.getAttribute('href').slice(4);
      const url = map[slug];
      if (!url) return;
      a.setAttribute('href', url);
      a.setAttribute('rel', 'sponsored noopener');
      a.classList.add('js-aff');
      a.dataset.aff = slug;
    });
  }

  // GA events
  document.addEventListener('submit',e=>{
    if(e.target.matches('form.js-newsletter')){
      window.gtag && gtag('event','newsletter_submit',{location:'post-inline'});
    }
  });
  document.addEventListener('click',e=>{
    const a=e.target.closest('a'); if(!a) return;
    if((a.rel||'').includes('sponsored')){
      window.gtag && gtag('event','affiliate_click',{item_id:a.dataset.aff||a.textContent.trim(), location:location.pathname});
    }
  });

  (async function(){
    const slug = getSlug();
    if(!slug){ document.getElementById('post-content').textContent='Missing slug.'; return; }

    const metaRes = await fetch('/posts/index.json',{cache:'no-store'});
    const posts = metaRes.ok ? await metaRes.json() : [];
    const post = posts.find(p=>p.slug===slug);
    if(!post){ document.getElementById('post-content').textContent='Post not found.'; return; }

    const canon = `https://www.sleeptechinsights.com/posts/${slug}/`;
    document.title = `${post.title} | SleepTechInsights`;
    const set = (sel, attr, val) => { const el = document.querySelector(sel); if (el) el.setAttribute(attr,val); }
    set('link[rel="canonical"]','href',canon);
    set('meta[name="description"]','content',post.excerpt||'');
    set('meta[property="og:title"]','content',`${post.title} | SleepTechInsights`);
    set('meta[property="og:description"]','content',post.excerpt||'');
    set('meta[property="og:url"]','content',canon);
    set('meta[property="og:image"]','content',post.ogImage||'');

    document.getElementById('post-title').textContent = post.title;
    document.getElementById('post-meta').textContent =
      `${post.category || 'Article'} • ${post.date || ''}`;

    const mdRes = await fetch(`/posts/content/${slug}.md`,{cache:'no-store'});
    const md = mdRes.ok ? await mdRes.text() : 'Content missing.';
    document.getElementById('post-content').innerHTML = mdToHtml(md);

    // New: CDN rewrite + affiliate resolve
    rewriteImagesToCdn();
    await resolveAffiliateLinks();

    window.gtag && gtag('event','post_view',{slug, category:post.category||'Unknown'});
  })();
</script>
</body>
</html>
'@ | Set-Content -Encoding utf8 post.html
