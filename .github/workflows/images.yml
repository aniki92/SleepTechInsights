name: Generate AVIF/WebP

on:
  push:
    branches: [ main ]
    paths:
      - 'images/posts/**'
      - 'scripts/convert-images.mjs'
      - 'package.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci || npm i
      - run: npm run images:build

      - name: Stage generated images
        run: |
          git add images/posts/*.webp images/posts/*.avif 2>/dev/null || true

      - name: Detect changes
        id: diff
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR with generated images
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(images): add generated AVIF/WebP"
          branch: ci/generated-images
          title: "chore(images): add generated AVIF/WebP"
          body: "Auto-generated image formats from GitHub Actions."
          labels: automation
